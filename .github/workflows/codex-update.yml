name: Codex Update

on:
  workflow_dispatch:
    inputs:
      type:
        description: "Update type"
        required: true
        type: choice
        options:
          - Quest
          - Transcript
          - Timeline
          - Character
          - Faction
          - Operation
          - ARG
          - Website
          - Other

      title:
        description: "Update title"
        required: true
        type: string

      update:
        description: "What changed?"
        required: true
        type: string

jobs:
  send-discord-update:
    runs-on: ubuntu-latest

    steps:
      - name: Send Codex Update to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "username": "The Lorak Codex",
              "embeds": [
                {
                  "title": "📖 Codex Update",
                  "description": "**${{ inputs.title }}**\n\n**Type:** ${{ inputs.type }}\n\n${{ inputs.update }}",
                  "color": 13934647
                }
              ]
            }'
