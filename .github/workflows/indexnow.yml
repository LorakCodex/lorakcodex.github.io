name: IndexNow

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  notify-bing:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed HTML pages
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            FILES=$(git diff-tree --no-commit-id --name-only -r "$AFTER")
          else
            FILES=$(git diff --name-only "$BEFORE" "$AFTER")
          fi

          URLS=""
          while IFS= read -r file; do
            case "$file" in
              *.html)
                if [ "$file" = "index.html" ]; then
                  URL="https://lorakcodex.github.io/"
                else
                  URL="https://lorakcodex.github.io/$file"
                fi
                URLS="${URLS}${URL}"$'\n'
                ;;
            esac
          done <<< "$FILES"

          printf '%s' "$URLS" > /tmp/urls.txt

          if [ -n "$URLS" ]; then
            echo "has_urls=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_urls=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Bing using IndexNow
        if: steps.changed.outputs.has_urls == 'true'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          key = os.environ["INDEXNOW_KEY"].strip()

          with open("/tmp/urls.txt", encoding="utf-8") as f:
              urls = list(dict.fromkeys(
                  line.strip() for line in f if line.strip()
              ))

          payload = {
              "host": "lorakcodex.github.io",
              "key": key,
              "keyLocation": (
                  f"https://lorakcodex.github.io/{key}.txt"
              ),
              "urlList": urls
          }

          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print(f"IndexNow response: HTTP {response.status}")
          except Exception as error:
              print(f"IndexNow submission failed: {error}")
              raise
          PY