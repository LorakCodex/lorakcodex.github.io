
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Add Google Analytics to HTML pages
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          tag = """<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-MDY9190N76"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-MDY9190N76');
          </script>"""

          updated = 0
          skipped = 0

          for path in Path(".").rglob("*.html"):
              if ".git" in path.parts:
                  continue

              content = path.read_text(encoding="utf-8")

              if "G-MDY9190N76" in content:
                  skipped += 1
                  continue

              match = re.search(r"<head\b[^>]*>", content, re.IGNORECASE)

              if not match:
                  print(f"Skipped (no head tag): {path}")
                  continue

              content = (
                  content[:match.end()]
                  + "\n"
                  + tag
                  + "\n"
                  + content[match.end():]
              )

              path.write_text(content, encoding="utf-8")
              updated += 1

          print(f"Analytics added to {updated} HTML files.")
          print(f"Already tagged: {skipped} HTML files.")
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
