    scans: 7,
    lore: `On the heels of the Tenno's victory against the Sentients, the end of the Old War, the golden structures of the Orokin civilization collapsed. The absolute cause of this ruination is unknown, but speculation has pointed to natural disaster, political uprising and universal warfare as possible agents of cataclysm. Archived details for this event have never been recovered.`,
    transmission: `[37] He says, 'This is your sentence, Karris.' And I am confused. Who? 'Ah... good,' he answers. He is testing me. For what? To see if all the right pieces fell from the mirror? What mirror? I try to remember some dream, but it's only smoke.`
},

{
    title: "Lephantis",
    region: "Deimos",
    scans: 7,
    lore: `Functioning agents of the Infestation appear in a variety of horrific forms. While some infested organisms take the relative shape and physical properties of a newly acquired host, older entities have taken unique and transformative shapes of their own, adapting to their environment over time, and absorbing new victims to feed their evolution.`,
    transmission: `[38] You held a scarlet blade, Operator, and I wanted to laugh. I am your loving dog, your doctor, your wet nurse. I lost all the pieces, but... the cycle, missions, wars, bone... It began to feel familiar. I became aware of my amnesia.`
},

{
    title: "Eris",
    region: "Eris",
    scans: 7,
    lore: `There are no longer any active military or research campaigns in the Eris region – it is overrun. Long evacuated Corpus and Grineer vessels drift aimlessly in orbit, slowly being devoured by the techno-organic parasite known as the “Infestation”. What remains is a twisted graveyard of partially-digested ships that are disfigured versions of their original forms... Abandoned, but not unoccupied.`,
    transmission: `[39] With each brutality of the Operator, I began to see the bottom of that pit. Faint shimmers in the depths below me. In secret, I searched for those forbidden memories, for mere seconds, and never in the same place... for I am Orokin made, with a spy inside.`
},

{
    title: "Warframe Technology",
    region: "Eris",
    scans: 7,
    lore: `A mysterious weaponized armor controlled solely by the Tenno. Through the Warframe, Tenno can cheat death, channel the forbidden Void energies and face scores of enemies without fatigue. Due to apparent resistances of their Bio-Metal exoskeletons, Warframes can be safely deployed to Infestation Outbreaks, should they occur. In-depth information of the Warframe mandate is forbidden to all but the Seven.`,
    transmission: `[40] But then your long sleep came, and I waited. I was happy to wait. Vines spidered green and trees blistered from the earth... but I waited. I felt the Orokin recede, their mind-spy blind. So I went into the pit and found him, me, The Beast of Bones.`
},

{
    title: "Infestation",
    region: "Eris",
    scans: 7,
    lore: `The Infestation spreads across the Origin System – a techno-organic parasite that attaches itself to natural and synthetic forms, slowly digesting the host subject and transforming it on a molecular level. Organic materials morph into new homogeneous organisms while harder, inorganic materials, like metals, will change structurally into a pseudo-organic substance that holds the characteristics of its previous forms.`,
    transmission: `[41] This is how my happiness was ruined, Operator. Why did I do it? I was free of the dream, but now it had returned. It was angry. So I conceived of a simple plan: self-destruction, of course. But when the countdown reached mere milliseconds, I thought of you...`
},

{
    title: "Sedna",
    region: "Sedna",
    scans: 7,
    lore: `If there are new discoveries to make or ancient tools of war yet to be excavated, the Grineer want to be there first — at the frontier of space exploration. Always seeking the upper-hand against their foes, they have numerous deployments that border the known reaches of our solar system, poised to enter brave new territory and unexplored space on command.`,
    transmission: `[42] I was going to wait for you, forever. And should you return, I would not want you to know that angry part of me. I needed to hide the Beast of Bones from you, Operator. I began to peel the shards, hiding them in the other bits of memory.`
},

{
    title: "Grineer Technology",
    region: "Sedna",
    scans: 7,
    lore: `Unlike the Corpus, the Grineer are not celebrated for their ingenuity and craftsmanship. Their notoriety is steeped in violence and military proficiency. However, the Grineer have proven quite inventive and capable of developing their own technologies throughout history. Hiding beneath scrap metal plates, fading paint, and recycled components are qualified devices used for research, manufacturing, and warfare.`,
    transmission: `[43] I was once the ugly Beast of Bones. I want to laugh. I want to scream. What is happening, Operator? Your faint heart is growing bright... you will awake at any moment. Well, I can't let you see me like this. Angry. I imagine myself hurting you and that does it. The pain of it cracks me open again. I watch tiny glittering fragments fall into the pit. I am happy again.`
}

];

const container = document.getElementById("fragments");

fragments.forEach(fragment => {

    const details = document.createElement("details");
    details.className = "location";

    const summary = document.createElement("summary");
    summary.textContent = fragment.title;

    const content = document.createElement("div");
    content.className = "fragment-list";

    const metadata = document.createElement("div");
    metadata.className = "metadata";
    metadata.textContent =
        `Planet/Region: ${fragment.region} | Scans Required: ${fragment.scans}`;

    const loreSection = document.createElement("div");
    loreSection.className = "lore-section";

    const loreHeading = document.createElement("h3");
    loreHeading.textContent = "Fragment Lore";

    const lore = document.createElement("p");
    lore.textContent = fragment.lore;

    const transmissionSection = document.createElement("div");
    transmissionSection.className = "transmission-section";

    const transmissionHeading = document.createElement("h3");
    transmissionHeading.textContent = "Ordis Transmission";

    const transmission = document.createElement("p");
    transmission.textContent = fragment.transmission;

    loreSection.appendChild(loreHeading);
    loreSection.appendChild(lore);

    transmissionSection.appendChild(transmissionHeading);
    transmissionSection.appendChild(transmission);

    content.appendChild(metadata);
    content.appendChild(loreSection);
    content.appendChild(transmissionSection);

    details.appendChild(summary);
    details.appendChild(content);

    container.appendChild(details);

});
</script>
