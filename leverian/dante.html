<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The Dante Leverian dialogue, preserved in The Lorak Codex.">
    <title>Dante Leverian | The Lorak Codex</title>
    <link rel="icon" type="image/png" href="../lorak-codex-favicon-48x48.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0b;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            line-height: 1.7;
        }

        header {
            background: #111;
            text-align: center;
            padding: 25px 15px;
            border-bottom: 1px solid #d4af37;
        }

        header h1 {
            color: #d4af37;
            letter-spacing: 3px;
            margin: 0;
        }

        header p {
            color: #ccc;
            margin: 8px 0 0;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            background: #111;
            border-bottom: 1px solid #333;
        }

        nav a {
            color: #d4af37;
            text-decoration: none;
            padding: 6px 10px;
        }

        nav a:hover {
            color: #fff;
        }

        main {
            max-width: 950px;
            margin: 0 auto;
            padding: 25px 15px 40px;
        }

        .back-link {
            display: inline-block;
            color: #d4af37;
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .back-link:hover {
            color: #fff;
        }

        .intro {
            border: 1px solid #d4af37;
            border-radius: 8px;
            background: #111;
            padding: 20px;
            margin-bottom: 25px;
        }

        .intro h2 {
            color: #d4af37;
            margin-top: 0;
        }

        .section {
            margin-bottom: 10px;
        }

        .section-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #d4af37;
            border-radius: 8px;
            background: #d4af37;
            color: #0b0b0b;
            text-align: left;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .section-button:hover {
            background: #f0d46b;
        }

        .section-button:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 3px;
        }

        .button-symbol {
            font-size: 20px;
            font-weight: bold;
            margin-left: 12px;
            flex-shrink: 0;
        }

        .dialogue {
            display: none;
            margin-top: 10px;
            padding: 18px;
            background: #111;
            border: 1px solid #d4af37;
            border-radius: 4px;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        .dialogue.open {
            display: block;
        }

        .dialogue p {
            margin: 0 0 16px;
        }

        .dialogue p:last-child {
            margin-bottom: 0;
        }

        footer {
            text-align: center;
            padding: 20px 15px;
            border-top: 1px solid #333;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>

<header>
