<script>
    let summariesPromise = null;

    function loadSummaries() {
        if (!summariesPromise) {
            summariesPromise = fetch("summaries.html")
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error("Could not load summaries.html");
                    }
                    return response.text();
                })
                .then(function (html) {
                    return new DOMParser().parseFromString(html, "text/html");
                });
        }

        return summariesPromise;
    }

    function normalizeTitle(title) {
        return title
            .replace(/^\s*\d+\.\s*/, "")
            .replace(/\s+/g, " ")
            .trim()
            .toLowerCase();
    }

    function toggleCategory(button) {
        const content = button.nextElementSibling;

        if (!content || !content.classList.contains("category-content")) {
            return;
        }

        const isOpen = !content.classList.contains("show");

        content.classList.toggle("show", isOpen);
        button.classList.toggle("active", isOpen);
        button.setAttribute("aria-expanded", String(isOpen));
    }

    async function toggleQuest(button) {
        const content = button.nextElementSibling;

        if (!content || !content.classList.contains("quest-content")) {
            return;
        }

        const isOpen = !content.classList.contains("show");

        content.classList.toggle("show", isOpen);
        button.classList.toggle("active", isOpen);
        button.setAttribute("aria-expanded", String(isOpen));

        if (!isOpen || content.dataset.loaded === "true") {
            return;
        }

        content.dataset.loaded = "true";

        try {
            const summaryDocument = await loadSummaries();
            const summaryButtons = summaryDocument.querySelectorAll(".quest-button");
            const targetTitle = normalizeTitle(button.textContent);

            let summaryContent = null;

            for (const summaryButton of summaryButtons) {
                if (normalizeTitle(summaryButton.textContent) === targetTitle) {
                    const next = summaryButton.nextElementSibling;

                    if (next && next.classList.contains("summary-content")) {
                        summaryContent = next;
                        break;
                    }
                }
            }

            if (summaryContent && summaryContent.innerHTML.trim() !== "") {
                content.innerHTML = summaryContent.innerHTML;
            }
        } catch (error) {
            content.dataset.loaded = "false";
            console.error("Unable to load quest summary:", error);
        }
    }
</script>
