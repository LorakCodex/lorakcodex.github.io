        }

        .category-content {
            display: none;
            background-color: #101010;
            border: 1px solid #333;

            background-color: #151515;
            color: #d4af37;

            padding: 15px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;

        .quest-button:hover,
        .quest-button.active {
            background-color: #1d1d1d;
        }

        .quest-content {
            display: none;
            background-color: #101010;
            border: 1px solid #333;
            border-top: none;
            padding: 10px 15px;
            line-height: normal;
        }

        .quest-content.show {
            display: block;
        }

        footer {

            padding: 30px;
            color: #777;

<script>
    function toggleCategory(button) {
        const content = button.nextElementSibling;

        if (!content || !content.classList.contains("category-content")) {
            return;
        }

        button.classList.toggle("active");
        content.classList.toggle("show");
    }

    function toggleQuest(button) {
        const content = button.nextElementSibling;

        if (!content || !content.classList.contains("quest-content")) {
            return;
        }

        button.classList.toggle("active");
        content.classList.toggle("show");
    }
</script>
