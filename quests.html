<script>
    function normalizeTitle(title) {
        return title
            .replace(/^\s*\d+\.\s*/, "")
            .replace(/\s+/g, " ")
            .trim()
            .toLowerCase();
    }

    const summaryFiles = {
        "the new war": "the-new-war.html",
        "old peace": "old-peace.html",
        "awakening": "awakening.html",
        "vor's prize": "vors-prize.html",
        "the teacher": "the-teacher.html",
        "vox solaris": "vox-solaris.html",
        "once awake": "once-awake.html",
        "heart of deimos": "heart-of-deimos.html",
        "the archwing": "the-archwing.html",
        "natah": "natah.html",
        "the second dream": "the-second-dream.html",
        "the war within": "the-war-within.html",
        "rising tide": "rising-tide.html",
        "chains of harrow": "chains-of-harrow.html",
        "apostasy prologue": "apostasy-prologue.html",
        "the sacrifice": "the-sacrifice.html",
        "prelude to war": "prelude-to-war.html",
        "the duviri paradox": "the-duviri-paradox.html",
        "angels of the zariman": "angels-of-the-zariman.html",
        "whispers in the walls": "whispers-in-the-walls.html",
        "jade shadows": "jade-shadows.html",
        "jade shadows: constellations": "jade-shadows-constellations.html",
        "the lotus eaters": "the-lotus-eaters.html",
        "the hex / warframe: 1999": "the-hex-warframe-1999.html",
        "tau prologue": "tau-prologue.html",
        "tau 2026": "tau-2026.html",

        "howl of the kubrow": "howl-of-the-kubrow.html",
        "the limbo theorem": "the-limbo-theorem.html",
        "patient zero": "patient-zero.html",
        "stolen dreams": "stolen-dreams.html",
        "the new strange": "the-new-strange.html",
        "a man of few words": "a-man-of-few-words.html",
        "the jordas precept": "the-jordas-precept.html",
        "sands of inaros": "sands-of-inaros.html",
        "the silver grove": "the-silver-grove.html",
        "the glast gambit": "the-glast-gambit.html",
        "octavia's anthem": "octavias-anthem.html",
        "saya's vigil": "sayas-vigil.html",
        "mask of the revenant": "mask-of-the-revenant.html",
        "the deadlock protocol": "the-deadlock-protocol.html",
        "call of the tempestarii": "call-of-the-tempestarii.html",
        "the waverider": "the-waverider.html",
        "veilbreaker": "veilbreaker.html"
    };

    function toggleCategory(button) {
        const content = button.nextElementSibling;

        if (!content || !content.classList.contains("category-content")) {
            return;
        }

        const isOpen = !content.classList.contains("show");

        content.classList.toggle("show", isOpen);
        button.classList.toggle("active", isOpen);
        button.setAttribute("aria-expanded", String(isOpen));
    }

    async function toggleQuest(button) {
        const content = button.nextElementSibling;

        if (!content || !content.classList.contains("quest-content")) {
            return;
        }

        const isOpen = !content.classList.contains("show");

        content.classList.toggle("show", isOpen);
        button.classList.toggle("active", isOpen);
        button.setAttribute("aria-expanded", String(isOpen));

        if (!isOpen || content.dataset.loaded === "true") {
            return;
        }

        const title = normalizeTitle(button.textContent);
        const filename = summaryFiles[title];

        if (!filename) {
            content.innerHTML = "<p>Summary coming soon.</p>";
            content.dataset.loaded = "true";
            return;
        }

        content.innerHTML = "<p>Loading summary...</p>";

        try {
            const response = await fetch(
                "summaries/" + filename + "?refresh=" + Date.now(),
                { cache: "no-store" }
            );

            if (!response.ok) {
                throw new Error("Summary file not found: " + filename);
            }

            const html = await response.text();
            const summaryDocument = new DOMParser().parseFromString(
                html,
                "text/html"
            );

            const body = summaryDocument.body;

            if (!body || !body.innerHTML.trim()) {
                throw new Error("The summary file is empty: " + filename);
            }

            body.querySelectorAll("script, style, nav, header, footer").forEach(
                function (element) {
                    element.remove();
                }
            );

            content.innerHTML = body.innerHTML.trim();
            content.dataset.loaded = "true";

        } catch (error) {
            content.innerHTML =
                "<p>Summary could not be loaded. Please check that " +
                filename +
                " exists in the summaries folder.</p>";

            content.dataset.loaded = "false";
            console.error("Unable to load quest summary:", error);
        }
    }
</script>
