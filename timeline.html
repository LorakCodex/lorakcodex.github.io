
<!DOCTYPE html>
<html lang="en">
<head>

<meta name="description" content="Explore the history of the Warframe universe through The Lorak Codex timeline, from the pre-Orokin era to the modern era and beyond.">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0b0b;
    color: #e0e0e0;
    font-family: Arial, sans-serif;
}

header {
    background: #111;
    padding: 25px 15px;
    text-align: center;
    border-bottom: 1px solid #333;
}

header h1 {
    color: #d4af37;
    letter-spacing: 3px;
    margin: 0;
    font-size: 28px;
}

nav {
    background: #151515;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    padding: 15px;
    border-bottom: 1px solid #292929;
}

nav a {
    color: #ccc;
    text-decoration: none;
    font-size: 14px;
}

nav a:hover {
    color: #d4af37;
}

main {
    max-width: 900px;
    margin: 0 auto;
    padding: 25px 15px 40px;
}

.era-button {
    display: block;
    width: 100%;
    background: #d4af37;
    color: #0b0b0b;
    border: none;
    padding: 14px 16px;
    margin-top: 10px;
    text-align: left;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 5px;
}

.era-button:hover {
    background: #e5c451;
}

.era-button::after {
    content: "+";
    float: right;
    font-size: 18px;
}

.era-button.active::after {
    content: "−";
}

.era-content {
    display: none;
    background: #111;
    border: 1px solid #66551d;
    border-radius: 5px;
    padding: 10px 15px;
    margin-top: 10px;
    line-height: 1.6;
}

.era-content.show {
    display: block;
}

footer {
    text-align: center;
    padding: 20px;
    border-top: 1px solid #66551d;
    color: #777;
    font-size: 13px;
}

@media (max-width: 600px) {
    nav {
        gap: 12px 18px;
    }
}
</style>
</head>

<body>

<header>
    <h1>THE LORAK CODEX</h1>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="quests.html">Quests</a>

    <a href="operations.html">Operations</a>
    <a href="args.html">ARGs</a>
    <a href="https://discord.gg/X3WsdC8jP4" target="_blank" rel="noopener noreferrer">Discord</a>
</nav>

<main>

    <button class="era-button" type="button" aria-expanded="false">Pre-Orokin Era</button>
    <div class="era-content">
        Timeline to be redone.
    </div>

    <button class="era-button" type="button" aria-expanded="false">Orokin Era</button>
    <div class="era-content">
        Timeline to be redone.
    </div>

    <button class="era-button" type="button" aria-expanded="false">Old War</button>
    <div class="era-content">
        Timeline to be redone.
    </div>

    <button class="era-button" type="button" aria-expanded="false">Collapse</button>
    <div class="era-content">
        Timeline to be redone.
    </div>

    <button class="era-button" type="button" aria-expanded="false">Post-Collapse</button>
    <div class="era-content">
        Timeline to be redone.
    </div>

    <button class="era-button" type="button" aria-expanded="false">Modern Era</button>
    <div class="era-content">
        Timeline to be redone.

    <div class="era-content">
        Timeline to be redone.
    </div>

</main>

<footer>
    The Lorak Codex
</footer>

<script>
document.querySelectorAll(".era-button").forEach(button => {
    button.addEventListener("click", () => {
        const content = button.nextElementSibling;
        const isOpen = !content.classList.contains("show");

        content.classList.toggle("show", isOpen);
        button.classList.toggle("active", isOpen);
        button.setAttribute("aria-expanded", String(isOpen));
    });
});
</script>

</body>
</html>
