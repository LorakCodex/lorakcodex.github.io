<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Timeline - The Lorak Codex</title>

<style>
    body {
        margin: 0;
        background: #0b0b0b;
        color: #ddd;
        font-family: Arial, sans-serif;
    }

    header {
        background: #111;
        padding: 25px;
        text-align: center;
        border-bottom: 1px solid #333;
    }

    h1 {
        color: #d4af37;
        letter-spacing: 3px;
        margin: 0;
    }

    nav {
        margin-top: 20px;
    }

    nav a {
        color: #d4af37;
        text-decoration: none;
        margin: 0 8px;
    }

    nav a:hover {
        text-decoration: underline;
    }

    .container {
        max-width: 900px;
        margin: 30px auto;
        padding: 0 15px;
    }

    .era-button {
        width: 100%;
        background: #151515;
        color: #d4af37;
        border: 1px solid #333;
        padding: 18px;
        margin-top: 12px;
        text-align: left;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 6px;
    }

    .era-button:hover {
        background: #1d1d1d;
    }

    .era-button.active {
        background: #1d1d1d;
    }

    .era-content {
        display: none;
        background: #111;
        border-left: 2px solid #d4af37;
        padding: 18px;
        margin-top: 5px;
        line-height: 1.6;
    }

    .era-content.show {
        display: block;
    }

    footer {
        text-align: center;
        color: #666;
        padding: 40px 20px;
        font-size: 14px;
    }
</style>
</head>

<body>

<header>
    <h1>THE LORAK CODEX</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="quests.html">Quests</a>
        <a href="transcripts.html">Transcripts</a>
        <a href="#">Characters</a>
        <a href="#">Factions</a>
        <a href="timeline.html">Timeline</a>
        <a href="operations.html">Operations</a>
        <a href="args.html">ARGs</a>
        <a href="https://discord.gg/X3WsdC8jP4">Discord</a>
    </nav>
</header>

<div class="container">

    <button class="era-button">Pre-Orokin Era</button>
    <div class="era-content">
    </div>

    <button class="era-button">Orokin Era</button>
    <div class="era-content">
    </div>

    <button class="era-button">Old War</button>
    <div class="era-content">
    </div>

    <button class="era-button">Collapse</button>
    <div class="era-content">
    </div>

    <button class="era-button">Post-Collapse</button>
    <div class="era-content">
    </div>

    <button class="era-button">Modern Era</button>
    <div class="era-content">
    </div>

    <button class="era-button">The New War</button>
    <div class="era-content">
    </div>

    <button class="era-button">Post-New War / Warframe: 1999</button>
    <div class="era-content">
    </div>

</div>

<footer>
    The Lorak Codex
</footer>

<script>
    document.querySelectorAll(".era-button").forEach(button => {
        button.addEventListener("click", () => {
            button.classList.toggle("active");

            const content = button.nextElementSibling;

            if (content) {
                content.classList.toggle("show");
            }
        });
    });
</script>

</body>
</html>
